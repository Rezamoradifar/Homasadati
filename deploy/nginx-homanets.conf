# Host Nginx template. The certificate paths below were issued for this domain.
# Review existing virtual hosts, back up their configuration and run nginx -t
# before reloading. Do not enable this alongside another block for these hosts.
server {
    listen 80;
    listen [::]:80;
    server_name homanets.com www.homanets.com;
    return 301 https://homanets.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.homanets.com;
    ssl_certificate /etc/letsencrypt/live/homanets.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homanets.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://homanets.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name homanets.com;
    ssl_certificate /etc/letsencrypt/live/homanets.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homanets.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 16m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
