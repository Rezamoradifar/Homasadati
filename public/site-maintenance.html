<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#143d3e" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="هما نت در حال به‌روزرسانی است. در این فاصله، از طریق اینستاگرام و ایمیل با ما در ارتباط باشید."
    />
    <title>در حال به‌روزرسانی | هما نت</title>
    <link
      rel="preload"
      href="/fonts/vazirmatn-arabic-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: "Vazirmatn";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/vazirmatn-arabic-400-normal.woff2") format("woff2");
      }

      @font-face {
        font-family: "Vazirmatn";
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("/fonts/vazirmatn-arabic-600-normal.woff2") format("woff2");
      }

      :root {
        color-scheme: dark;
        font-family: "Vazirmatn", Tahoma, sans-serif;
        color: #f5eee2;
        background: #143d3e;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        --cream: #f5eee2;
        --copper: #e9ae8c;
        --muted: #bdcec5;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 280px;
        background:
          radial-gradient(ellipse at 15% 36%, #245354 0, transparent 55%),
          radial-gradient(ellipse at 88% 90%, #113334 0, transparent 60%),
          #143d3e;
      }

      a {
        color: inherit;
      }

      a:focus-visible {
        outline: 3px solid var(--copper);
        outline-offset: 6px;
      }

      a,
      button {
        -webkit-tap-highlight-color: transparent;
      }

      ::selection {
        color: #143d3e;
        background: var(--copper);
      }

      .page {
        width: min(1192px, calc(100% - 112px));
        min-height: 100vh;
        min-height: 100svh;
        margin-inline: auto;
        display: flex;
        flex-direction: column;
        padding-block: clamp(30px, 5vh, 56px);
      }

      .masthead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.8;
      }

      .masthead p {
        margin: 0;
      }

      .domain {
        direction: ltr;
        font-family: Arial, sans-serif;
        font-size: 10px;
        font-weight: 400;
        letter-spacing: 0.24em;
      }

      .masthead-label {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .masthead-label::before {
        content: "";
        width: 22px;
        height: 1px;
        background: var(--copper);
      }

      main {
        flex: 1;
        display: grid;
        grid-template-columns: 1.08fr 0.92fr;
        align-items: center;
        gap: clamp(24px, 6vw, 88px);
        padding-block: 58px 64px;
      }

      .message {
        min-width: 0;
        padding-block: 12px;
      }

      .status {
        width: fit-content;
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 0 0 25px;
        padding: 8px 14px;
        border: 1px solid #647c6c;
        border-radius: 999px;
        color: #eddec6;
        background: #ffffff05;
        font-size: 12px;
        line-height: 1.6;
      }

      .status-dot {
        width: 6px;
        height: 6px;
        flex: none;
        border-radius: 50%;
        background: var(--copper);
        box-shadow: 0 0 0 4px #e9ae8c0c;
      }

      h1 {
        margin: 0;
        font-size: clamp(35px, 4vw, 54px);
        font-weight: 600;
        line-height: 1.65;
        letter-spacing: -0.025em;
      }

      h1 > span {
        display: block;
      }

      h1 em {
        color: var(--copper);
        font-style: normal;
      }

      .description {
        max-width: 440px;
        margin: 22px 0 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 2.2;
      }

      .description span {
        display: block;
      }

      .actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-block-start: 33px;
      }

      .button {
        min-height: 52px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 13px 21px;
        border: 1px solid transparent;
        border-radius: 9px;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.8;
        text-decoration: none;
        transition:
          background-color 180ms ease,
          border-color 180ms ease,
          transform 180ms ease;
      }

      .button svg {
        width: 17px;
        height: 17px;
        flex: none;
      }

      .button-primary {
        color: #153b3c;
        background: var(--cream);
      }

      .button-primary:hover {
        background: #fff9ef;
        transform: translateY(-2px);
      }

      .button-secondary {
        border-color: #5c7974;
        background: transparent;
        color: var(--cream);
      }

      .button-secondary:hover {
        border-color: #9eafa0;
        background: #ffffff08;
        transform: translateY(-2px);
      }

      .scene {
        position: relative;
        width: 100%;
        max-width: 444px;
        aspect-ratio: 0.92;
        margin-inline: auto;
        isolation: isolate;
      }

      .scene::before {
        content: "";
        position: absolute;
        inset: 11% -9% 0;
        z-index: -1;
        border-radius: 50%;
        background: radial-gradient(ellipse, #b9aa7a10, transparent 68%);
      }

      .arch {
        position: absolute;
        width: 67%;
        height: 80%;
        inset-inline-start: 16.5%;
        bottom: 9%;
        display: grid;
        place-items: center;
        border-radius: 180px 180px 3px 3px;
        background: linear-gradient(145deg, #f4eddf, #e7ddc9);
        box-shadow:
          inset 0 0 0 1px #ffffff50,
          0 24px 60px #071f241f;
      }

      .arch::before,
      .arch::after {
        content: "";
        position: absolute;
        border: 1px solid #cbb99038;
        border-bottom: 0;
        border-radius: 220px 220px 0 0;
        pointer-events: none;
      }

      .arch::before {
        inset: -20px -20px 0;
      }

      .arch::after {
        inset: -40px -40px 0;
        border-color: #cbb9901f;
      }

      .brand {
        display: block;
        width: 52%;
        height: auto;
        margin-block-start: 12%;
      }

      .sun {
        position: absolute;
        width: 23%;
        aspect-ratio: 1;
        top: 3%;
        left: 1%;
        z-index: 1;
        overflow: hidden;
        border: 1px solid #edc09b;
        border-radius: 50%;
        background: linear-gradient(140deg, #e9bb95, #b9805c);
        box-shadow: 0 8px 34px #102f3920;
      }

      .sun::after {
        content: "";
        position: absolute;
        inset: 52% 0 0;
        background: repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 5px,
          #143d3e35 5px,
          #143d3e35 6px
        );
      }

      .horizon {
        position: absolute;
        width: 91%;
        height: 1px;
        left: 4.5%;
        bottom: 9%;
        background: linear-gradient(90deg, transparent, #c5b38e80 25%, #c5b38e80 75%, transparent);
      }

      .horizon::before,
      .horizon::after {
        content: "";
        position: absolute;
        height: 1px;
        background: linear-gradient(90deg, transparent, #c5b38e40, transparent);
      }

      .horizon::before {
        inset: 13px -4% auto;
      }

      .horizon::after {
        inset: 26px -8% auto;
        opacity: 0.5;
      }

      .spark {
        position: absolute;
        width: 17px;
        height: 17px;
        right: 0;
        top: 29%;
        color: #d7be92;
      }

      .spark::before,
      .spark::after {
        content: "";
        position: absolute;
        background: currentColor;
      }

      .spark::before {
        width: 1px;
        height: 17px;
        left: 8px;
      }

      .spark::after {
        width: 17px;
        height: 1px;
        top: 8px;
      }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding-block-start: 24px;
        border-block-start: 1px solid #c6c8af28;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.9;
      }

      footer p {
        margin: 0;
      }

      .email {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        color: #ecdfc9;
        border-radius: 3px;
        text-decoration: none;
      }

      .email span {
        font-family: Arial, sans-serif;
        font-size: 12px;
        letter-spacing: 0.04em;
      }

      .email svg {
        width: 17px;
        height: 17px;
        flex: none;
      }

      .email:hover span {
        text-decoration: underline;
        text-underline-offset: 5px;
      }

      @media (min-width: 1400px) {
        main {
          padding-block: 76px;
        }
      }

      @media (max-width: 1000px) {
        .page {
          width: calc(100% - 64px);
        }

        main {
          gap: 28px;
        }

        h1 {
          font-size: 36px;
        }

        .description {
          font-size: 14px;
        }

        .button {
          padding-inline: 15px;
          font-size: 12px;
        }

        .arch::before {
          inset: -15px -15px 0;
        }

        .arch::after {
          inset: -30px -30px 0;
        }
      }

      @media (max-width: 720px) {
        .page {
          width: calc(100% - 40px);
          padding-block: 23px 18px;
        }

        .masthead {
          font-size: 11px;
        }

        .domain {
          font-size: 9px;
          letter-spacing: 0.13em;
        }

        main {
          grid-template-columns: 1fr;
          gap: 17px;
          padding-block: 31px 34px;
        }

        .message {
          grid-row: 2;
          padding: 0;
          text-align: center;
        }

        .scene {
          grid-row: 1;
          width: min(216px, 65vw);
          aspect-ratio: 1.04;
        }

        .arch {
          width: 63%;
          inset-inline-start: 18.5%;
          height: 82%;
        }

        .arch::before {
          inset: -11px -11px 0;
        }

        .arch::after {
          inset: -22px -22px 0;
        }

        .sun {
          width: 22%;
          left: 3%;
          top: 2%;
        }

        .spark {
          right: 2%;
          transform: scale(0.65);
        }

        .horizon::before {
          top: 8px;
        }

        .horizon::after {
          top: 16px;
        }

        .status {
          margin: 0 auto 16px;
          padding: 6px 12px;
          font-size: 11px;
        }

        h1 {
          font-size: clamp(29px, 6.3vw, 39px);
          line-height: 1.6;
        }

        .description {
          margin: 14px auto 0;
          font-size: 13px;
          line-height: 2.1;
        }

        .actions {
          justify-content: center;
          gap: 10px;
          margin-block-start: 24px;
        }

        .button {
          min-height: 48px;
          padding: 12px 17px;
          font-size: 12px;
        }

        footer {
          flex-direction: column;
          justify-content: center;
          gap: 4px;
          padding-block-start: 18px;
          text-align: center;
          font-size: 11px;
        }
      }

      @media (max-width: 360px) {
        .page {
          width: calc(100% - 32px);
        }

        .masthead-label {
          gap: 7px;
        }

        .masthead-label::before {
          width: 14px;
        }

        .scene {
          width: 180px;
        }

        .button {
          padding-inline: 13px;
          gap: 7px;
          font-size: 11px;
        }

        .description {
          font-size: 12px;
        }
      }

      @media (max-height: 600px) and (min-width: 721px) {
        .page {
          padding-block: 24px;
        }

        main {
          padding-block: 30px;
        }

        .scene {
          max-width: 310px;
        }

        .status {
          margin-block-end: 13px;
        }

        h1 {
          font-size: 35px;
        }

        .description {
          margin-block-start: 12px;
        }

        .actions {
          margin-block-start: 20px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
        }

        .button:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <p class="masthead-label">هما نت</p>
        <p class="domain" lang="en">HOMANETS.COM</p>
      </header>

      <main aria-labelledby="maintenance-title">
        <section class="message" aria-labelledby="maintenance-title">
          <p class="status">
            <span class="status-dot" aria-hidden="true"></span>
            در حال به‌روزرسانی
          </p>

          <h1 id="maintenance-title">
            <span>در حال به‌روزرسانی</span>
            <span><em>هما نت</em> هستیم</span>
          </h1>

          <p class="description">
            <span>داریم تجربه‌ای بهتر برای شما آماده می‌کنیم.</span>
            <span>از همراهی و شکیبایی شما سپاسگزاریم.</span>
          </p>

          <div class="actions">
            <a class="button button-primary" href="/">
              بررسی دوباره
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 7v5h-5" />
                <path d="M19.2 12a7.3 7.3 0 1 0-1.9 5.1M20 12l-2.1-4.5" />
              </svg>
            </a>
            <a class="button button-secondary" href="https://www.instagram.com/homa.nets/">
              اینستاگرام هما نت
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="5" />
                <circle cx="12" cy="12" r="4" />
                <circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none" />
              </svg>
            </a>
          </div>
        </section>

        <div class="scene">
          <div class="sun" aria-hidden="true"></div>
          <div class="arch">
            <img
              class="brand"
              src="/assets/brand/homanet-stacked-orange.png"
              alt="نشان هما نت — HOMANET"
              width="1592"
              height="1600"
              decoding="async"
            />
          </div>
          <div class="horizon" aria-hidden="true"></div>
          <div class="spark" aria-hidden="true"></div>
        </div>
      </main>

      <footer>
        <p>در این فاصله، با ما در ارتباط باشید.</p>
        <a class="email" href="mailto:info@homanets.com" aria-label="ارسال ایمیل به هما نت: info@homanets.com">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2.5" />
            <path d="m4 7 8 6 8-6" />
          </svg>
          <span lang="en" dir="ltr">info@homanets.com</span>
        </a>
      </footer>
    </div>
  </body>
</html>
