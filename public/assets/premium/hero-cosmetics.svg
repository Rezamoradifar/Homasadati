  <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#64440b"/><stop offset=".10" stop-color="#aa7626"/><stop offset=".23" stop-color="#ffeaae"/><stop offset=".40" stop-color="#d6a34d"/><stop offset=".58" stop-color="#fff2bc"/><stop offset=".78" stop-color="#bc8a2f"/><stop offset=".93" stop-color="#785116"/><stop offset="1" stop-color="#b58123"/></linearGradient>
